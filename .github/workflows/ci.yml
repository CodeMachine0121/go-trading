# The reason this exists is the storage tests. They talk to a real PostgreSQL and
# skip themselves when TEST_POSTGRES_DSN is unset, so `make test` on a laptop stays
# green through anything they would have caught — and they have caught real defects
# that no other test could: an ORM handed a context it treats as a model field, a
# unique-constraint translation that only the driver's own error type can make, a
# request answered with the wrong status code.
#
# So this workflow does not merely run the tests with a database attached. It fails
# when the storage tests skip, because a skipped guard reads exactly like a passing
# one and that is the whole problem it was built to solve.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: go_trading_test
        ports:
          - 5432:5432
        # Without waiting for health, the first test races the database's startup.
        options: >-
          --health-cmd "pg_isready -U postgres -d go_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The database name has to end in _test: the storage tests refuse to run
      # against anything else, because they empty the tables every time.
      TEST_POSTGRES_DSN: >-
        host=localhost port=5432 user=postgres password=testpass
        dbname=go_trading_test sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: mocks match the interfaces they are generated from
        run: |
          go generate ./...
          if ! git diff --quiet -- internal/domain/interface/mocks; then
            echo "::error::the mocks are stale — run 'make mock' and commit the result"
            git --no-pager diff --stat -- internal/domain/interface/mocks
            exit 1
          fi

      - name: go test
        run: go test ./... -count=1 -race

      # The script compartment's memory cap is enforced by Linux and measured without
      # the race detector: the detector's shadow memory counts against the cap and
      # would make every figure a lie, so those cases skip under -race. This run is
      # the one that proves the cap on the binary the service actually ships, and a
      # skip here means nothing proved it.
      - name: the script memory cap was proved rather than skipped
        run: |
          set -o pipefail
          go test ./internal/infrastructure/script/tests/ -count=1 -v | tee script.log
          if grep -q '^    --- SKIP\|^--- SKIP' script.log; then
            echo "::error::script memory-cap tests skipped — the cap went unproved"
            grep -B1 -A2 'SKIP' script.log
            exit 1
          fi

      # The point of the whole file. A skip here means the database never reached
      # the tests, and every storage guarantee went unchecked while the run stayed
      # green.
      - name: the storage tests ran rather than skipped
        run: |
          # Without pipefail the exit status here is tee's, so a storage test that
          # actually failed would be piped straight past this step.
          set -o pipefail
          go test ./internal/infrastructure/persistence/tests/ -count=1 -v | tee storage.log
          if grep -q '^--- SKIP' storage.log; then
            echo "::error::storage tests skipped — TEST_POSTGRES_DSN never reached them"
            grep '^--- SKIP' storage.log
            exit 1
          fi
          echo "storage tests that ran: $(grep -c '^--- PASS' storage.log)"

  # Publishing is a separate job rather than more steps on the one above, so that the
  # dependency between them is stated rather than implied by ordering: an image is
  # only built once the storage tests have actually run and passed. An image nothing
  # verified is worse than no image at all, because it looks deployable.
  publish:
    needs: verify

    # Pull requests never reach here. This repository is public, so anyone can open
    # one, and a fork's PR must not be able to put an image under this name — even
    # though GitHub already withholds the token's write scope from forks. Saying it
    # here means the rule holds regardless of what the default happens to be.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # The tag the deploy job below writes into the manifests.
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: read
      # The only addition. With this, the job's built-in token can push to GHCR, so
      # there is no registry password to create, store or rotate anywhere.
      packages: write

    steps:
      - uses: actions/checkout@v5

      # The version is computed once, here, and both the tag that gets pushed and
      # the tag written back into the deployment come from this one value. Working
      # it out twice would raise the question of whether the two agree, and the way
      # that question fails is a deployment pointing at a tag that was never pushed.
      #
      # Short form, because where it gets read and typed is a manifest.
      - id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance/sbom off. Each of them adds a second, untagged manifest to
          # the package on every push, and on a free account the only thing those
          # buy here is a faster walk into the storage limit. Turning them off is
          # also what keeps one push equal to one version, which is the assumption
          # the prune job below counts on.
          provenance: false
          sbom: false
          # Layer cache lives with the workflow, so an unchanged go.mod does not
          # re-download the whole module graph on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Old versions are never deleted by anything else, and the free account this
  # publishes to has 500 MB to spend on private packages. Left alone, the limit is
  # reached quietly and the next push simply fails — so the pruning runs on the same
  # event that causes the growth, rather than on a schedule somebody has to remember.
  #
  # It is a separate job so that a successful publish stays green when the prune
  # fails. A failure here is worth seeing, but it did not break the release.
  prune:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      # Deleting a version needs write, not read. This is the same scope the publish
      # job already holds, granted separately because this job does a different thing
      # with it.
      packages: write

    steps:
      # Five, not one: a rollback target has to still exist to be rolled back to, and
      # the version being replaced is exactly the one most likely to be wanted back.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: go-trading
          package-type: container
          min-versions-to-keep: 5

  # The last link. Publishing an image changes nothing on its own — something has to
  # say "run this one", and that something is a commit in the deployment repository,
  # because Argo CD reads git and nothing else.
  #
  # Writing it from here rather than letting a controller watch the registry keeps the
  # deployment history in git: who released what, when, in one log.
  deploy:
    # publish, not prune. Whether old versions got tidied up has nothing to do with
    # whether this release should go out.
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      # This job needs nothing from this repository's token. What it writes to is
      # another repository, and the key for that is a deploy key scoped to it alone
      # — it can push there and it can do nothing else, anywhere.
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          repository: CodeMachine0121/go-trading-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          ref: main
          # Full history: the push below rebases when it loses a race, and a shallow
          # clone has nothing to rebase onto.
          fetch-depth: 0

      - name: Point the deployment at this commit
        env:
          IMAGE: ghcr.io/codemachine0121/go-trading
          TAG: ${{ needs.publish.outputs.tag }}
          # Through the environment, never interpolated into the script below. A
          # commit message is text somebody wrote, and `${{ }}` pasted into a shell
          # line would run whatever that text happens to say.
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # yq rather than sed: it sets the newTag field of the images entry with
          # this name, not whichever line of the file happens to look right. Adding
          # a second image later cannot make this edit the wrong one. It is already
          # on the runner, so there is no version to pin and nothing to install.
          yq -i "(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)" \
            go-trading/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go-trading/kustomization.yaml
          if git diff --cached --quiet; then
            echo "deployment already points at $TAG"
            exit 0
          fi

          SUBJECT=$(printf '%s\n' "$SOURCE_MESSAGE" | head -1)
          git commit -m "Deploy go-trading $TAG" \
                     -m "${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "$SUBJECT"

          # Both services write to the same repository, so two releases at once means
          # one of these pushes arrives second and is refused. Rebase and retry rather
          # than force: the other push set a different service's version, and both
          # need to survive.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused, rebasing onto what landed first (attempt $attempt)"
            git pull --rebase
          done

          echo "::error::could not write the deployment update after three attempts"
          exit 1
